name: econ_indicators
version: "1.0.0"
config-version: 2
profile: econ_indicators

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

models:
  econ_indicators:
    staging:
      +schema: staging
      +materialized: view
      +tags: ["staging"]
    marts:
      +schema: marts
      +materialized: table
      +tags: ["marts"]
    reporting:
      +schema: reporting
      +materialized: table
      +tags: ["reporting"]

seeds:
  econ_indicators:
    +schema: reference
    +tags: ["staging"]
